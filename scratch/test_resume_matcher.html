<!DOCTYPE html>
<html>
<head>
    <title>Resume Matcher Test</title>
</head>
<body>
    <h1>Testing Resume Matching Logic</h1>
    <script>
        const sampleResume = `
        Jane Doe, RN, BSN
        Registered Nurse with 6 years of experience in ICU, Emergency Medicine, and Patient Care.
        Certifications: BLS, ACLS, Florida Registered Nursing License.
        Skills: Critical Care, EMR, Patient Assessment, IV Therapy, Clinical Triage.
        Experience at Regional Medical Center Leesburg and Hospital Care.
        `;

        const sampleJobs = [
            {
                Job_Title: "UF Health - Registered Nurse - Emergency Dept",
                Company: "UF Health (The Villages Hospital)",
                Description: "RN position in Emergency Department providing critical patient care and assessment. Full-time qualifying.",
                Category: "CATEGORY III",
                TVCS_Qualifying: true
            },
            {
                Job_Title: "City of Wildwood - Police Officer",
                Company: "City of Wildwood",
                Description: "Patrol duties and municipal law enforcement in Wildwood.",
                Category: "CATEGORY II",
                TVCS_Qualifying: true
            },
            {
                Job_Title: "The Villages Health - Medical Assistant",
                Company: "The Villages Health / CenterWell",
                Description: "Assist clinical provider with patient triage, vitals, and EMR records.",
                Category: "CATEGORY III",
                TVCS_Qualifying: true
            }
        ];

        function matchResume(resumeText, jobs) {
            const stopWords = new Set(['and', 'the', 'for', 'with', 'in', 'of', 'to', 'at', 'a', 'or', 'on', 'is', 'as', 'an', 'by', 'be', 'are', 'this', 'that', 'our', 'all', 'from', 'with', 'your', 'has', 'have']);
            const cleanText = resumeText.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
            const resumeTokens = new Set(cleanText.split(/\s+/).filter(w => w.length > 2 && !stopWords.has(w)));
            
            // Build common n-grams
            const words = cleanText.split(/\s+/).filter(w => w.length > 0);
            const ngrams = new Set();
            for (let i = 0; i < words.length - 1; i++) {
                ngrams.add(`${words[i]} ${words[i+1]}`);
                if (i < words.length - 2) {
                    ngrams.add(`${words[i]} ${words[i+1]} ${words[i+2]}`);
                }
            }

            return jobs.map(job => {
                const titleLower = job.Job_Title.toLowerCase();
                const descLower = (job.Description || '').toLowerCase();
                const fullJobText = `${titleLower} ${job.Company.toLowerCase()} ${descLower}`;
                
                const matchedSkills = [];
                let score = 0;

                // N-gram multi-word match (e.g. "registered nurse", "patient care")
                for (const ng of ngrams) {
                    if (titleLower.includes(ng)) {
                        score += 30;
                        if (!matchedSkills.includes(ng) && matchedSkills.length < 5) matchedSkills.push(ng);
                    } else if (descLower.includes(ng)) {
                        score += 15;
                        if (!matchedSkills.includes(ng) && matchedSkills.length < 5) matchedSkills.push(ng);
                    }
                }

                // Single word match
                const jobTokens = new Set(fullJobText.replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stopWords.has(w)));
                for (const token of jobTokens) {
                    if (resumeTokens.has(token)) {
                        if (titleLower.includes(token)) {
                            score += 15;
                            if (!matchedSkills.includes(token) && matchedSkills.length < 5) matchedSkills.push(token);
                        } else {
                            score += 5;
                            if (!matchedSkills.includes(token) && matchedSkills.length < 5) matchedSkills.push(token);
                        }
                    }
                }

                if (job.TVCS_Qualifying) score += 10;

                // Normalize score to percentage (capped at 98%)
                const percentage = Math.min(98, Math.max(15, Math.round((score / 120) * 100)));

                return {
                    ...job,
                    matchScore: percentage,
                    matchedSkills: matchedSkills
                };
            }).sort((a, b) => b.matchScore - a.matchScore);
        }

        const results = matchResume(sampleResume, sampleJobs);
        console.log("Matched results:", results);
        window.results = results;
    </script>
</body>
</html>
