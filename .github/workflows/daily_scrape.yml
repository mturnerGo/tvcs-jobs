name: Daily TVCS Jobs Ingestion

on:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 6:00 AM EDT (10:00 UTC)
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper Pipeline
        run: python scraper.py

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_data.json employers_data.json tvcs_jobs.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TVCS job listings [skip ci]" && git push)